<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --midnight: #0D0B07;
  --surface: #1C1910;
  --amber: #F2A020;
  --amber-dim: #B87A10;
  --cream: #EBE5D5;
  --cream-dim: #A89F8C;
  --teal: #2BBFAA;
  --gray-border: #2E2B1F;
  --gray-mid: #504C3E;
  --gray-light: #6B6858;
  --font-display: 'Barlow Condensed', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'Barlow', sans-serif;
}

html, body {
  height: 100%;
}

body {
  background: var(--midnight);
  color: var(--cream);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NOISE TEXTURE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: -30%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.06;
  pointer-events: none;
  z-index: 100;
  animation: grain 0.65s steps(1, end) infinite;
  will-change: transform;
}

@keyframes grain {
  0%    { transform: translate(  0%,   0%); }
  12.5% { transform: translate( -4%,  -8%); }
  25%   { transform: translate(-12%,   3%); }
  37.5% { transform: translate(  6%, -14%); }
  50%   { transform: translate( -3%,  11%); }
  62.5% { transform: translate(-10%,   6%); }
  75%   { transform: translate( 12%,  -7%); }
  87.5% { transform: translate( -6%,   4%); }
  100%  { transform: translate(  0%,   0%); }
}

@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
}

/* ── AMBIENT GLOW (cursor-tracked) ── */
body::after {
  content: '';
  position: fixed;
  top: var(--glow-y, 20%);
  left: var(--glow-x, 50%);
  transform: translate(-50%, -50%);
  width: 900px;
  height: 600px;
  background: radial-gradient(ellipse at center, rgba(242,160,32,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  will-change: top, left;
}

/* ── MAIN ── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  position: relative;
  z-index: 1;
}

/* ── LOGO ── */
.logo {
  text-align: center;
  animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  position: relative;
}

.mark {
  position: absolute;
  right: 100%;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #D4D4D4 0%, #ABABAB 30%, #7A7A7A 60%, #444444 85%, #232323 100%);
  box-shadow: inset -2px -2px 5px rgba(0,0,0,0.55), inset 2px 2px 3px rgba(255,255,255,0.22), 0 3px 12px rgba(0,0,0,0.75);
  margin-right: 16px;
  cursor: pointer;
  user-select: none;
}

.flipper-word {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(96px, 18vw, 160px);
  line-height: 0.88;
  letter-spacing: -0.015em;
  color: var(--cream);
  display: inline-block;
  position: relative;
}

.berlin-word {
  font-family: var(--font-mono);
  font-size: clamp(11px, 2vw, 16px);
  letter-spacing: 0.5em;
  color: var(--amber);
  text-transform: uppercase;
  display: block;
  margin-top: 14px;
  animation: fadeUp 0.9s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* ── CONTACT ── */
.contact {
  margin-top: 64px;
  text-align: center;
  animation: fadeUp 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.contact-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--gray-light);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.contact-link {
  font-family: var(--font-mono);
  font-size: clamp(13px, 2.5vw, 16px);
  color: var(--cream-dim);
  text-decoration: none;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--gray-mid);
  padding-bottom: 2px;
  display: inline-block;
  transition: color 0.2s, border-color 0.2s,
              transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}

.contact-link:hover {
  color: var(--amber);
  border-color: var(--amber-dim);
}

/* ── FOOTER ── */
footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--gray-border);
  padding: 24px 40px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  animation: fadeUp 0.9s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.footer-nav {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--gray-light);
}

.footer-nav a {
  color: var(--gray-light);
  text-decoration: none;
  display: inline-block;
  transition: color 0.2s, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}

.footer-nav a:hover {
  color: var(--amber);
}

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── MOBILE ── */
@media (max-width: 480px) {
  .mark {
    width: 34px;
    height: 34px;
    margin-right: 10px;
  }
  footer {
    padding: 20px 24px;
  }
  body::after {
    top: 50%;
    left: 50%;
  }
}
</style>
</head>
<body>

<main>
  <div class="logo">
    <span class="flipper-word"><span class="mark"></span>FLIPPER</span>
    <span class="berlin-word">BERLIN</span>
  </div>

  <div class="contact">
    <p class="contact-label">Kontakt · Contact</p>
    <a class="contact-link" href="mailto:hello@flipperberlin.de">hello@flipperberlin.de</a>
  </div>
</main>

<footer>
  <nav class="footer-nav">
    <a href="impressum.html">Impressum</a>
  </nav>
</footer>

<script>
(() => {
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (!fine) return;

  const root = document.documentElement;
  let mx = window.innerWidth / 2, my = window.innerHeight * 0.2;
  let gx = mx, gy = my;
  let pointerX = mx, pointerY = my;

  window.addEventListener('mousemove', (e) => {
    mx = e.clientX;
    my = e.clientY;
    pointerX = e.clientX;
    pointerY = e.clientY;
  }, { passive: true });

  const magnets = [...document.querySelectorAll('.contact-link, .footer-nav a')];

  function frame() {
    // Parallax glow — eased follow
    gx += (mx - gx) * 0.06;
    gy += (my - gy) * 0.06;
    root.style.setProperty('--glow-x', gx + 'px');
    root.style.setProperty('--glow-y', gy + 'px');

    // Magnetic links — pull toward cursor when nearby
    const radius = 110;
    magnets.forEach(el => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = pointerX - cx;
      const dy = pointerY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist < radius) {
        const strength = (1 - dist / radius) * 0.4;
        el.style.transform = `translate(${dx * strength}px, ${dy * strength}px)`;
      } else {
        el.style.transform = '';
      }
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
// Pinball easter egg — click the silver ball to launch it
(() => {
  const mark = document.querySelector('.mark');
  const flipper = document.querySelector('.flipper-word');
  if (!mark) return;

  // Create a stand-in ball that flies around, so the original .mark
  // stays in its CSS-positioned slot and we sidestep any inline-style
  // / !important / transform conflicts.
  const ball = document.createElement('div');
  ball.setAttribute('aria-hidden', 'true');
  Object.assign(ball.style, {
    position: 'fixed',
    width: '44px',
    height: '44px',
    borderRadius: '50%',
    background: 'radial-gradient(circle at 35% 32%, #D4D4D4 0%, #ABABAB 30%, #7A7A7A 60%, #444444 85%, #232323 100%)',
    boxShadow: 'inset -2px -2px 5px rgba(0,0,0,0.55), inset 2px 2px 3px rgba(255,255,255,0.22), 0 3px 12px rgba(0,0,0,0.75)',
    pointerEvents: 'none',
    zIndex: '9999',
    left: '-9999px',
    top: '-9999px',
    willChange: 'transform, left, top',
  });
  document.body.appendChild(ball);

  const G = 2100;
  const REST = 0.75;
  const AIR = 0.999;
  const REST_SPEED = 35;
  const MAX_LIFE_MS = 15000;

  let launched = false;
  let x, y, vx, vy, size;
  let raf, lastT, startT;
  let obstacles = [];

  function snapshotObstacles() {
    obstacles = [];
    const sels = '.flipper-word, .berlin-word, .contact-label, .contact-link, .footer-nav a';
    document.querySelectorAll(sels).forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return;
      obstacles.push({ left: r.left, right: r.right, top: r.top, bottom: r.bottom });
    });
  }

  function show() { mark.style.visibility = ''; }
  function hide() { mark.style.visibility = 'hidden'; }

  function placeBall() {
    ball.style.left = x + 'px';
    ball.style.top = y + 'px';
  }

  function launch() {
    const r = mark.getBoundingClientRect();
    size = r.width;
    x = r.left;
    y = r.top;
    placeBall();
    hide();

    vx = (Math.random() < 0.5 ? -1 : 1) * (250 + Math.random() * 350);
    vy = -1300;

    snapshotObstacles();
    launched = true;
    lastT = performance.now();
    startT = lastT;
    raf = requestAnimationFrame(step);
  }

  function reset() {
    cancelAnimationFrame(raf);
    launched = false;
    ball.style.left = '-9999px';
    ball.style.top = '-9999px';
    show();
  }

  function step(now) {
    const dt = Math.min(0.032, (now - lastT) / 1000);
    lastT = now;

    vy += G * dt;
    vx *= AIR;
    x += vx * dt;
    y += vy * dt;

    const W = window.innerWidth, H = window.innerHeight;
    const rad = size / 2;

    if (x < 0) { x = 0; if (vx < 0) vx = -vx * REST; }
    if (x + size > W) { x = W - size; if (vx > 0) vx = -vx * REST; }
    if (y + size > H) { y = H - size; if (vy > 0) vy = -vy * REST; }
    if (y < 0) { y = 0; if (vy < 0) vy = -vy * REST; }

    const cx = x + rad, cy = y + rad;
    for (const o of obstacles) {
      const px = Math.max(o.left, Math.min(cx, o.right));
      const py = Math.max(o.top, Math.min(cy, o.bottom));
      const dx = cx - px, dy = cy - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < rad * rad) {
        let nx, ny, d;
        if (d2 < 0.0001) {
          const lo = cx - o.left, ro = o.right - cx;
          const to = cy - o.top,  bo = o.bottom - cy;
          const m = Math.min(lo, ro, to, bo);
          if      (m === lo) { nx = -1; ny =  0; }
          else if (m === ro) { nx =  1; ny =  0; }
          else if (m === to) { nx =  0; ny = -1; }
          else               { nx =  0; ny =  1; }
          d = 0;
        } else {
          d = Math.sqrt(d2);
          nx = dx / d; ny = dy / d;
        }
        x += nx * (rad - d);
        y += ny * (rad - d);
        const vdotn = vx * nx + vy * ny;
        if (vdotn < 0) {
          vx -= (1 + REST) * vdotn * nx;
          vy -= (1 + REST) * vdotn * ny;
        }
      }
    }

    placeBall();

    const speed = Math.hypot(vx, vy);
    const onFloor = y + size >= H - 1;
    if (speed < REST_SPEED && onFloor) {
      setTimeout(reset, 450);
      return;
    }
    if (now - startT > MAX_LIFE_MS) {
      reset();
      return;
    }

    raf = requestAnimationFrame(step);
  }

  function handleClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (launched) {
      vy = -1300;
      vx += (Math.random() - 0.5) * 500;
    } else {
      launch();
    }
  }

  mark.addEventListener('click', handleClick);
})();
</script>
